[project]
name = "weather-dashboard"
version = "1.0.0"
description = "Dashboard for Weather MCP Server request analytics"
requires-python = ">=3.11"

dependencies = [
    "streamlit>=1.35.0",
    "psycopg2-binary>=2.9.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
