[project]
name = "weather-mcp-server"
version = "1.0.0"
description = "Weather Prediction MCP Server for Databricks Agent Bricks"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "psycopg2-binary>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
